services:
  polycopy-web:
    build: .
    restart: unless-stopped

    # Coolify/Traefik connects to the container network; no host port needed.
    expose:
      - "8041"

    environment:
      WEB_PORT: "8041"
      WEB_USERNAME: "${WEB_USERNAME:-admin}"
      WEB_PASSWORD: "${WEB_PASSWORD:-}"
      WEB_SESSION_TTL_S: "${WEB_SESSION_TTL_S:-604800}"
      POLY_PROJECT_DIR: /app/project
      # These must be injected here: the dashboard reads them at import time,
      # and hardcoded values would override Coolify's environment panel.
      POLY_DB_PATH: "${POLY_DB_PATH:-/app/project/data/live_f705.db}"
      POLY_CONFIG_PATH: "${POLY_CONFIG_PATH:-/app/project/configs/live_f705.toml}"

    volumes:
      # The bot runs on the host and writes this SQLite DB. Mount the
      # project dir read-write so the dashboard can also edit the TOML config.
      # Override POLY_HOST_DIR if the project lives somewhere else.
      - "${POLY_HOST_DIR:-/root/polycopy}:/app/project"

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8041/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
