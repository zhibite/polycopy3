[account]
starting_cash = 10000.0

[run]
# paper = internal simulated book; live = real CLOB orders.
# Changing this requires a bot restart.
mode = "paper"

[live]
# Keep dry_run = true until `polycopy live check` and a manual $1 order pass.
dry_run = true
private_key_env = "POLY_PRIVATE_KEY"
funder = ""
signature_type = 2
host = "https://clob.polymarket.com"
chain_id = 137
max_order_usd = 500.0
max_total_exposure_usd = 5000.0
max_daily_loss_usd = 500.0
min_order_shares = 5.0
order_timeout_seconds = 30
kill_switch_path = "data/LIVE_HALT"
redeem = true
max_book_depth_pct = 0.25
db_path = "data/live_f705.db"
log_path = "data/live_f705.log"

[paper]
poll_seconds = 5
overlap_seconds = 900
stale_signal_seconds = 300
# Polymarket taker fee = shares * fee_rate * p * (1-p).
# Per-market feeSchedule: monthly/weekly crypto 0.01; BTC 5m/15m 0.05.
# f705 currently trades monthly/weekly markets, so use 0.01.
fee_rate = 0.01
extra_slippage = 0.0
min_fill_ratio = 0.5
max_buy_drift = 0.03
max_sell_drift = 0.1
max_buy_drift_pct = 0.1
max_sell_drift_pct = 0.15
settle_every_seconds = 300
mark_every_seconds = 300
risk_check_seconds = 30
orphan_grace_seconds = 120.0
mark_limit = 100
max_pages = 3
page_limit = 500
cash_reserve_pct = 0.05
min_shares = 1.0
request_timeout = 20
request_retries = 4
db_path = "data/paper_f705.db"
log_path = "data/paper_f705.log"

# f705 — 30–70c core bucket.
# 2026-11-27: paper focus is paddaa; f705 disabled (no new entries).
# 2026-11-26: scale 5% per copied buy (cap $300); only target buys >= $20 with at
# least 1h to settlement. Live entry uses a maker GTC at the target price,
# then a FAK tail capped at +2% after 5 minutes. TP/SL exits when the target
# has not sold.
[targets.f705]
address = "0xf705fa045201391d9632b7f3cde06a5e24453ca7"
enabled = false
sizing_mode = "scale"
scale_factor = 0.05
fixed_notional_usd = 10.0
min_notional_usd = 2.0
max_notional_usd = 300.0
buy_price_min = 0.01
buy_price_max = 0.70
min_target_usd = 20.0
max_target_usd = 1000000000000.0
copy_sells = true
initial_lookback_seconds = 300
max_market_usd = 500.0
max_open_positions = 300
min_hours_to_end = 1.0
maker_entry_enabled = true
maker_timeout_seconds = 300
fak_max_premium_pct = 0.02
take_profit_pct = 0.10
stop_loss_pct = 0.20
exclude_event_substrings = []
exclude_slug_substrings = []

# paddaa — 0x60a92c...: 30–70c event markets (geopolitics/politics/AI),
# 73% maker, median hold ~10 days, sells often. Added 2026-11-26 for the
# multi-target paper test. 2026-11-27: exits = follow target sells + TP10, no stop loss.
[targets.paddaa]
address = "0x60a92c8620846d81f5ea17b0564e0d4b7c545a71"
enabled = true
sizing_mode = "scale"
scale_factor = 0.05
fixed_notional_usd = 10.0
min_notional_usd = 2.0
max_notional_usd = 300.0
buy_price_min = 0.01
buy_price_max = 0.70
min_target_usd = 20.0
max_target_usd = 1000000000000.0
copy_sells = true
initial_lookback_seconds = 300
max_market_usd = 500.0
max_open_positions = 300
min_hours_to_end = 1.0
maker_entry_enabled = true
maker_timeout_seconds = 300
fak_max_premium_pct = 0.02
take_profit_pct = 0.10
stop_loss_pct = 0.0
exclude_event_substrings = []
exclude_slug_substrings = []
